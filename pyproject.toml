[project]
name = "ytmeta"
version = "0.1.0"
description = "CLI to view and edit metadata of your uploaded YouTube videos"
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client>=2.150",
  "google-auth-oauthlib>=1.2",
]

[project.scripts]
ytmeta = "ytmeta.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ytmeta"]
